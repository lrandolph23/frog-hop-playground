
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frog Hop Playground</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game-container">

        <header class="game-header">
            <h1>Frog Hop Playground</h1>
            <p>A tiny adventure in a little green world.</p>
        </header>

        <section class="game-area" aria-label="Frog game">
            <div class="game-sky">
                <div class="sun"></div>

                <div class="frog" id="frog" aria-label="Player frog">
                    🐸
                </div>

                <div class="ground"></div>
            </div>
        </section>

        <section class="game-controls">
            <p>Use the arrow keys to move your frog!</p>
            <button id="start-button">Start hopping</button>
        </section>

        <footer class="game-footer">
            <p>Made with curiosity and a little bit of magic.</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
