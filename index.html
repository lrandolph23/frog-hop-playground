
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frogwood: The Mushroom Wizard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game-container">

        <header class="game-header">
            <h1>Frogwood</h1>
            <p>The Mushroom Wizard</p>
        </header>

        <section class="game-layout">

            <aside class="game-sidebar">
                <h2>Adventurer</h2>

                <div class="stat">
                    <span>Health</span>
                    <div class="stat-bar health-bar">
                        <div class="stat-fill" id="health-fill"></div>
                    </div>
                </div>

                <div class="stat">
                    <span>Mana</span>
                    <div class="stat-bar mana-bar">
                        <div class="stat-fill" id="mana-fill"></div>
                    </div>
                </div>

                <div class="stat">
                    <span>Experience</span>
                    <div class="stat-bar xp-bar">
                        <div class="stat-fill" id="xp-fill"></div>
                    </div>
                </div>

                <div class="inventory">
                    <h3>🍄 Mushrooms</h3>
                    <p id="mushroom-count">0</p>
                </div>
            </aside>

            <section class="game-area" aria-label="Frogwood game world">
                <canvas
                    id="game-canvas"
                    width="800"
                    height="600"
                    aria-label="Top-down enchanted forest game"
                ></canvas>
            </section>

        </section>

        <section class="game-controls">
            <p>Explore the forest. Gather mushrooms. Discover magic.</p>
            <p>WASD or Arrow Keys to move</p>
        </section>

        <footer class="game-footer">
            <p>A little adventure beneath the enchanted trees.</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
